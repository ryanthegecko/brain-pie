<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Pie</title>
    <meta property="og:title" content="Brain Pie" />
    <meta property="og:url" content="https://ryanthegecko.github.io/brain-pie/" />
    <meta property="og:image" content="./og.png" />
    <meta property="og:image:width" content="849" />
    <meta property="og:image:height" content="782" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <h1>Brain Pie 🥧</h1>
            <div class="top-buttons">
                <button onclick="UI.showMenu()">➕ Add Items</button>
                <button class="tertiary" onclick="App.exportData()">📥 Export</button>
                <button class="tertiary" onclick="document.getElementById('import-file').click()">📤 Import</button>
                <input type="file" id="import-file" accept=".json" onchange="App.importData(event)">
            </div>
        </div>
        <div class="storage-status" id="storage-status"></div>

        <div id="chart-container"></div>

        <div class="categories-section">
            <h2>Categories & Items</h2>
            <div class="categories-grid" id="categories-list"></div>
        </div>
    </div>

    <!-- Menu Overlay -->
    <div class="menu-overlay" id="menu-overlay" onclick="UI.closeMenuIfOutside(event)">
        <div class="menu-content" onclick="event.stopPropagation()">
            <button class="menu-close" onclick="UI.closeMenu()">✕</button>
            
            <div class="menu-section">
                <h2>Add New Item</h2>
                <div class="controls">
                    <div class="input-group">
                        <label for="item-category">Category</label>
                        <select id="item-category">
                            <option value="">Select category...</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="item-name">Item Name</label>
                        <input type="text" id="item-name" placeholder="e.g., Passport">
                    </div>
                    
                    <div class="input-group">
                        <label for="item-percentage">Percentage (optional)</label>
                        <input type="number" id="item-percentage" min="1" max="100" placeholder="10">
                    </div>
                    
                    <div class="input-group">
                        <label for="item-color">Color</label>
                        <input type="color" id="item-color" value="#4CAF50">
                    </div>
                    
                    <div class="input-group">
                        <label for="sub-items">Sub-items (one per line)</label>
                        <textarea id="sub-items" placeholder="open gov site&#10;get method&#10;do pictures"></textarea>
                        <span class="helper-text">Enter each sub-item on a new line</span>
                    </div>
                    
                    <div class="input-group" style="justify-content: flex-end;">
                        <label>&nbsp;</label>
                        <button onclick="App.addItem()">Add Item</button>
                    </div>
                </div>
            </div>

            <div class="menu-section">
                <h2>Add New Category</h2>
                <div class="controls">
                    <div class="input-group">
                        <label for="new-category-name">Category Name</label>
                        <input type="text" id="new-category-name" placeholder="e.g., Health">
                    </div>
                    <div class="input-group">
                        <label for="new-category-color">Color</label>
                        <input type="color" id="new-category-color" value="#4CAF50">
                    </div>
                    <div class="input-group" style="justify-content: flex-end;">
                        <label>&nbsp;</label>
                        <button class="secondary" onclick="App.addCategory()">Add Category</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="storage.js"></script>
    <script src="data-model.js"></script>
    <script src="chart-renderer.js"></script>
    <script src="ui-controller.js"></script>
    <script src="app.js"></script>
</body>
</html>
